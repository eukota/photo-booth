AWSTemplateFormatVersion: "2010-09-09"
Transform: AWS::Serverless-2016-10-31
Description: Kinetic Photo Booth MVP - capture -> S3 -> gallery

Parameters:
  GalleryPassword:
    Type: String
    NoEcho: true
    Description: Shared operator password for the gallery login
  DeployCloudFront:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: >
      Set to "false" for local (LocalStack) deploys, whose community
      edition doesn't emulate CloudFront/OAC. The frontend is instead
      served with a plain local static server against the same API. Real
      AWS deploys always leave this "true".
  PresignEndpointUrl:
    Type: String
    Default: ""
    Description: >
      Leave empty for real AWS deploys (uses boto3's default AWS
      endpoint). For local (LocalStack) deploys, set to
      "http://localhost:4566" so pre-signed URLs are reachable from the
      host browser instead of LocalStack's internal Docker address.

Conditions:
  ShouldDeployCloudFront: !Equals [!Ref DeployCloudFront, "true"]

Resources:
  PhotosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "kinetic-photo-booth-photos-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-after-30-days
            Status: Enabled
            ExpirationInDays: 30

  SessionSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: kinetic-photo-booth-session-secret
      GenerateSecretString:
        SecretStringTemplate: '{}'
        GenerateStringKey: "secret"
        PasswordLength: 32
        ExcludePunctuation: true

  AuthFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinetic-photo-booth-auth
      Runtime: python3.12
      Handler: src.lambdas.auth.handler.lambda_handler
      CodeUri: ../
      Timeout: 10
      Environment:
        Variables:
          GALLERY_PASSWORD: !Ref GalleryPassword
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${SessionSecret}:SecretString:secret}}"
      Events:
        AuthApi:
          Type: Api
          Properties:
            RestApiId: !Ref GalleryApi
            Path: /auth
            Method: POST

  ListPhotosFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: kinetic-photo-booth-list-photos
      Runtime: python3.12
      Handler: src.lambdas.list_photos.handler.lambda_handler
      CodeUri: ../
      Timeout: 10
      Policies:
        - S3ReadPolicy:
            BucketName: !Ref PhotosBucket
      Environment:
        Variables:
          PHOTOS_BUCKET_NAME: !Ref PhotosBucket
          SESSION_SECRET: !Sub "{{resolve:secretsmanager:${SessionSecret}:SecretString:secret}}"
          PRESIGN_ENDPOINT_URL: !Ref PresignEndpointUrl
      Events:
        ListApi:
          Type: Api
          Properties:
            RestApiId: !Ref GalleryApi
            Path: /photos
            Method: GET

  GalleryApi:
    Type: AWS::Serverless::Api
    Properties:
      StageName: prod
      # The gallery frontend is a static site served from a different
      # origin than the API (S3/CloudFront in prod, a plain local static
      # server in dev) - this handles the OPTIONS preflight. The actual
      # GET/POST responses still need Access-Control-Allow-Origin set by
      # the Lambda code itself (API Gateway doesn't add it to responses
      # coming from a Lambda proxy integration).
      Cors:
        AllowOrigin: "'*'"
        AllowHeaders: "'Content-Type,Authorization'"
        AllowMethods: "'GET,POST,OPTIONS'"
      # Throttle the whole API (the /auth route is the sensitive one - a
      # single shared password - so keep this low; per the design's
      # error-handling section, brute-force attempts must be blunted).
      MethodSettings:
        - ResourcePath: "/*"
          HttpMethod: "*"
          ThrottlingBurstLimit: 5
          ThrottlingRateLimit: 1

  PhotoUploaderUser:
    Type: AWS::IAM::User
    Properties:
      UserName: kinetic-photo-booth-uploader
      Policies:
        - PolicyName: PutObjectOnly
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: s3:PutObject
                Resource: !Sub "${PhotosBucket.Arn}/*"

  FrontendBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "kinetic-photo-booth-frontend-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true

  FrontendOAC:
    Type: AWS::CloudFront::OriginAccessControl
    Condition: ShouldDeployCloudFront
    Properties:
      OriginAccessControlConfig:
        Name: kinetic-photo-booth-frontend-oac
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  FrontendDistribution:
    Type: AWS::CloudFront::Distribution
    Condition: ShouldDeployCloudFront
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: frontend-origin
            DomainName: !GetAtt FrontendBucket.RegionalDomainName
            S3OriginConfig: {}
            OriginAccessControlId: !Ref FrontendOAC
        DefaultCacheBehavior:
          TargetOriginId: frontend-origin
          ViewerProtocolPolicy: redirect-to-https
          CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6 # CachingOptimized

  FrontendBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Condition: ShouldDeployCloudFront
    Properties:
      Bucket: !Ref FrontendBucket
      PolicyDocument:
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub "${FrontendBucket.Arn}/*"
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${FrontendDistribution}"

Outputs:
  PhotosBucketName:
    Value: !Ref PhotosBucket
    Export:
      Name: kinetic-photo-booth-photos-bucket-name
  ApiBaseUrl:
    Value: !Sub "https://${GalleryApi}.execute-api.${AWS::Region}.amazonaws.com/prod"
  GalleryUrl:
    Condition: ShouldDeployCloudFront
    Value: !Sub "https://${FrontendDistribution.DomainName}"
